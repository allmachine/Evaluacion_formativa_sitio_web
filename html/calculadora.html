<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="../js/funciones.js" defer></script>
  <title>Calculadora</title>
</head>

<body>
  <main class="contenido container my-5">
    <h2 class="text-center">Calculadora</h2>
    <p class="text-center mb-4">En esta sección puedes realizar operaciones matemáticas básicas.</p>

    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card shadow-sm">
          <div class="card-body p-4">

            <form>
              <!-- Inputs lado a lado en pantallas medianas, apilados en móvil -->
              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label for="num1" class="form-label">Número 1</label>
                  <input type="number" id="num1" name="num1" class="form-control" required>
                </div>
                <div class="col-md-6">
                  <label for="num2" class="form-label">Número 2</label>
                  <input type="number" id="num2" name="num2" class="form-control" required>
                </div>
              </div>

              <!-- Botones del mismo tamaño: 2x2 en móvil, 4 en fila en escritorio -->
              <div class="row g-2 mb-4">
                <div class="col-6 col-md-3 d-grid">
                  <button type="button" class="btn btn-primary" onclick="sumar()">Sumar</button>
                </div>
                <div class="col-6 col-md-3 d-grid">
                  <button type="button" class="btn btn-primary" onclick="restar()">Restar</button>
                </div>
                <div class="col-6 col-md-3 d-grid">
                  <button type="button" class="btn btn-primary" onclick="multiplicar()">Multiplicar</button>
                </div>
                <div class="col-6 col-md-3 d-grid">
                  <button type="button" class="btn btn-primary" onclick="dividir()">Dividir</button>
                </div>
              </div>

              <!-- Resultado -->
              <div>
                <label for="resultado" class="form-label">Total</label>
                <input type="number" id="resultado" name="resultado" class="form-control form-control-lg" readonly>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
