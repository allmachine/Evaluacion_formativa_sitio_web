<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/logo-del-bullita.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <title>websiteallmachine</title>
</head>

<body class="bg-light">

  <header class="encabezado d-flex align-items-center justify-content-center gap-3 py-3">
    <img src="img/logo-del-bullita.png" alt="Logo" class="logo">
    <h1 class="m-0">Welcome my website</h1>
  </header>

  <nav>
    <ul class="nav justify-content-center">
      <li class="nav-item"><a class="nav-link" href="../index.html">Volver a inicio</a></li>
      <li class="nav-item"><a class="nav-link" href="acercade.html">Acerca de</a></li>
      <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
    </ul>
  </nav>

  <main class="contenido container my-5">
    <h2 class="text-center">Contactos</h2>
    <p class="text-center mb-4">En esta sección puedes encontrar información de contacto.</p>

    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body p-4">

            <form action="" method="get">

              <fieldset class="mb-4">
                <legend class="fs-5 fw-bold border-bottom pb-2 mb-3">Datos personales</legend>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="nombre" class="form-label">Nombre:</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" required>
                  </div>
                  <div class="col-md-6">
                    <label for="apellido" class="form-label">Apellido:</label>
                    <input type="text" class="form-control" id="apellido" name="apellido" required>
                  </div>
                  <div class="col-md-6">
                    <label for="date" class="form-label">Fecha de nacimiento:</label>
                    <input type="date" class="form-control" id="date" name="date" required>
                  </div>
                  <div class="col-md-6">
                    <label for="region" class="form-label">Región:</label>
                    <select class="form-select" id="region" name="region" required>
                      <option value="" selected disabled>Seleccionar región</option>
                      <option value="1">Arica y Parinacota</option>
                      <option value="2">Tarapacá</option>
                      <option value="3">Antofagasta</option>
                      <option value="4">Atacama</option>
                      <option value="5">Coquimbo</option>
                      <option value="6">Valparaíso</option>
                      <option value="7">Metropolitana de Santiago</option>
                      <option value="8">Libertador General Bernardo O'Higgins</option>
                      <option value="9">Maule</option>
                      <option value="10">Ñuble</option>
                      <option value="11">Biobío</option>
                      <option value="12">La Araucanía</option>
                      <option value="13">Los Ríos</option>
                      <option value="14">Los Lagos</option>
                      <option value="15">Aysén del General Carlos Ibáñez del Campo</option>
                      <option value="16">Magallanes y de la Antártica Chilena</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label for="email" class="form-label">Correo electrónico:</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                  </div>
                  <div class="col-md-6">
                    <label for="telefono" class="form-label">Teléfono:</label>
                    <input type="tel" class="form-control" id="telefono" name="telefono">
                  </div>
                </div>
              </fieldset>

              <fieldset class="mb-4">
                <legend class="fs-5 fw-bold border-bottom pb-2 mb-3">Educación</legend>
                <div class="row g-3">
                  <div class="col-md-6">
                    <p class="form-label mb-2">Nivel de educación:</p>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="nivel" id="nivel1" value="basica" checked>
                      <label class="form-check-label" for="nivel1">Enseñanza básica</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="nivel" id="nivel2" value="media">
                      <label class="form-check-label" for="nivel2">Enseñanza media</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="nivel" id="nivel3" value="superior">
                      <label class="form-check-label" for="nivel3">Enseñanza superior</label>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label for="carrera" class="form-label">Carrera:</label>
                    <select class="form-select" id="carrera" name="carrera">
                      <option value="" selected disabled>Seleccionar una carrera</option>
                      <option value="1">Ingeniería Civil</option>
                      <option value="2">Ingeniería Mecánica</option>
                      <option value="3">Ingeniería Eléctrica</option>
                    </select>
                  </div>
                </div>
              </fieldset>

              <div class="mb-4">
                <label for="mensaje" class="form-label">Mensaje:</label>
                <textarea class="form-control" id="mensaje" name="mensaje" rows="4" required></textarea>
              </div>

              <div class="text-center">
                <button type="submit" class="btn btn-primary">Enviar</button>
