<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <title>websiteallmachine</title>
</head>

<body>

  <header class="encabezado">
    <img src="img/logo-del-bullita.png" alt="Logo" class="logo">
    <h1>Welcome my website</h1>
  </header>

  <nav>
    <ul>
      <li><a href="../index.html">volver a inicio</a></li>
      <li><a href="acercade.html">Acerca de</a></li>
      <li><a href="servicios.html">servicios</a></li>
    </ul>
  </nav>
  <main class="contenido">
    <h2>Contactos</h2>
    <p>En esta sección puedes encontrar información de contacto.</p>
    <form action="" method="get">
      <fieldset>
        <legend>Formulario de contacto</legend>
        <div class="mb-3">
          <div class="col-md-6 text-center">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required><br><br>
          </div>

          <div class="mb-3 text-center">
            <div class="col-md-6">
              <label for="apellido">Apellido:</label>
              <input type="text" id="apellido" name="apellido" required><br><br>
            </div>

            <div class="mb-3 text-center">
              <div class="col-md-6">
                <label for="date">Fecha de nacimiento:</label>
                <input type="date" id="date" name="date" required><br><br>
              </div>

              <div class="mb-3 text-center">
                <div class="col-md-6">
                  <label for="email">Correo electrónico:</label>
                  <input type="email" id="email" name="email" required><br><br>
                </div>


                <div class="mb-3 text-center">
                  <div class="col-md-6">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono"><br><br>
                  </div>

                  <div class="mb-3 text-center">
                    <div class="col-md-6">
                      <label for="mensaje">Mensaje:</label><br>
                      <textarea id="mensaje" name="mensaje" rows="4" cols="50" required></textarea><br><br>
                    </div>



                    <select class="form-select" aria-label="Seleccionar región de Chile">
                      <option selected>Seleccionar Region</option>
                      <option value="1">Arica y Parinacota</option>
                      <option value="2">Tarapacá</option>
                      <option value="3">Antofagasta</option>
                      <option value="4">Atacama</option>
                      <option value="5">Coquimbo</option>
                      <option value="6">Valparaíso</option>
                      <option value="7">Metropolitana de Santiago</option>
                      <option value="8">Libertador General Bernardo O'Higgins</option>
                      <option value="9">Maule</option>
                      <option value="10">Ñuble</option>
                      <option value="11">Biobío</option>
                      <option value="12">La Araucanía</option>
                      <option value="13">Los Ríos</option>
                      <option value="14">Los Lagos</option>
                      <option value="15">Aysén del General Carlos Ibáñez del Campo</option>
                      <option value="16">Magallanes y de la Antártica Chilena</option>
                    </select>
                    <input type="submit" value="Enviar">
      </fieldset>


    </form>
  </main>


  <section>

  </section>

  <footer>
    Maximiliano varas
  </footer>

</body>

</html>
