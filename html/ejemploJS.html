<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ampolleta</title>
    <script>
        function apagarAmpolleta() {
            document.getElementById("ampolleta").src = "../img/apagada.jpg";
        }
        function encenderAmpolleta() {
            document.getElementById("ampolleta").src = "../img/encendida.jpg";
        }
    </script>
</head>

<body>
    <h1 style="text-align: center;">Ejemplo de JavaScript</h1>

    <div style="display: flex; justify-content: center;">
        <img id="ampolleta" src="../img/apagada.jpg" alt="Ampolleta apagada" width="200" height="200">
    </div>

    <div style="display: flex; justify-content: center; align-items: center; gap: 10px;">
        <button onclick="encenderAmpolleta()">Encender</button>
        <button onclick="apagarAmpolleta()">Apagar</button>
    </div>
</body>

</html>
